<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Masa linkləri — Almaz və Aydın</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap">
<style>
  :root{--ivory:#f6f8fd;--veil:#e4ecfa;--corn:#7f99e0;--royal:#3a4db6;--ink:#1f2b62;--mute:#6c7cae;--line:#c9d6f3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 600px at 50% -8%,#f5f8ff 0,var(--veil) 70%);color:var(--ink);font:500 17px/1.45 'Cormorant Garamond',Georgia,serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:28px 18px 60px}
  h1{font:400 46px/1.05 'Great Vibes',cursive;color:var(--royal);text-align:center}
  .sub{text-align:center;color:var(--mute);font-style:italic;margin:6px 0 22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 40px -28px rgba(58,77,182,.55)}
  label{display:block;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font:500 19px/1.3 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:#fff;outline:none}
  input:focus{border-color:var(--royal)}
  .row{display:grid;grid-template-columns:1fr 96px;gap:10px;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 18px;font:600 14px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,#6a80dc,#4a5fc4);color:#fff;text-decoration:none;box-shadow:0 12px 20px -14px rgba(58,77,182,.9)}
  .btn.full{width:100%;min-height:50px;font-size:15px}
  .btn.sm{padding:9px 12px;font-size:12px;box-shadow:none}
  .btn.wa{background:#25a35a}
  .btn.ghost{background:#fff;color:var(--royal);border:1px solid var(--line)}
  .btn.del{background:#fff;color:#b2364b;border:1px solid #efc9d0}
  .h2{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
  .h2 b{font-size:20px}.h2 span{color:var(--mute);font-style:italic}
  .list{display:flex;flex-direction:column;gap:10px}
  .it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
  .top b{font-size:19px;line-height:1.2}
  .badge{white-space:nowrap;font-weight:600;font-size:13px;color:var(--royal);background:#e8eefc;padding:4px 10px;border-radius:999px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--mute);font-style:italic;padding:16px;border:1px dashed var(--line);border-radius:16px}
  .note{margin-top:18px;font-style:italic;color:var(--mute);text-align:center;font-size:15px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Almaz və Aydın</h1>
  <p class="sub">Qonaqlar üçün masa linkləri</p>

  <div class="card">
    <div class="row">
      <div><label for="nm">Qonağın adı</label><input id="nm" maxlength="60" placeholder="məs. Əli bəy və ailəsi" autocomplete="off"></div>
      <div><label for="tb">Masa №</label><input id="tb" type="number" min="1" max="999" inputmode="numeric" placeholder="5"></div>
    </div>
    <button class="btn full" id="mk">Link yarat</button>
  </div>

  <div class="h2"><b>Yaradılan linklər</b><span id="cnt"></span></div>
  <div class="list" id="list"></div>
  <p class="note">Bu səhifənin linkini qonaqlara göndərməyin.<br>Masanı dəyişmək üçün yeni link yaradıb yenidən göndərin.</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var SITE='https://devetiyfcom.github.io/AA/';
  var SECRET='AA-almaz-aydin-11112026';   /* index.html-dəki ilə eyni olmalıdır */
  var KEY='aa-masa-linkleri';

  function $(i){return document.getElementById(i)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function h(str){var x=2166136261;for(var i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}return (x>>>0).toString(36)}
  function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function link(n,t){var p=n+'|'+t;return SITE+'?d='+b64(p+'|'+h(SECRET+p))}
  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1800)}

  var items=[];
  try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}

  function draw(){
    $('cnt').textContent=items.length?items.length+' qonaq':'';
    if(!items.length){$('list').innerHTML='<div class="empty">Hələ link yaradılmayıb</div>';return}
    $('list').innerHTML=items.map(function(x,i){
      var msg='Hörmətli '+x.n+', Almaz və Aydının toy dəvətnaməsi:\n'+x.u;
      return '<div class="it"><div class="top"><b>'+esc(x.n)+'</b><span class="badge">Masa '+esc(x.t)+'</span></div>'+
        '<div class="acts">'+
        '<a class="btn sm wa" href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">WhatsApp</a>'+
        '<button class="btn sm" data-c="'+i+'">Kopyala</button>'+
        '<a class="btn sm ghost" href="'+esc(x.u)+'" target="_blank" rel="noopener">Bax</a>'+
        '<button class="btn sm del" data-x="'+i+'">Sil</button>'+
        '</div></div>';
    }).join('');
  }

  function copy(t){
    function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Link kopyalandı')}catch(e){toast('Kopyalanmadı')}a.remove()}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Link kopyalandı')},fb);else fb();
  }

  $('mk').onclick=function(){
    var n=$('nm').value.replace(/\|/g,' ').trim(),t=$('tb').value.trim();
    if(!n){toast('Qonağın adını yazın');$('nm').focus();return}
    if(!t){toast('Masa nömrəsini yazın');$('tb').focus();return}
    items.unshift({n:n,t:t,u:link(n,t)});save();draw();
    $('nm').value='';$('tb').value='';$('nm').focus();toast('Link hazırdır');
  };
  $('tb').addEventListener('keydown',function(e){if(e.key==='Enter')$('mk').click()});
  $('list').onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.c!==undefined)copy(items[b.dataset.c].u);
    if(b.dataset.x!==undefined){items.splice(+b.dataset.x,1);save();draw()}
  };
  draw();
})();
</script>
</body>
</html>
